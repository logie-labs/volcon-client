[package]
name = "volcon"
version = "0.1.6"
description = "Turn a MIDI controller into a volume mixer for Windows."
license = "MIT"
repository = "https://github.com/logie-labs/volcon-client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "volcon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }
midir = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_Multimedia", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
semver = "1"
sha2 = "0.10"
tauri-plugin-single-instance = "2"
